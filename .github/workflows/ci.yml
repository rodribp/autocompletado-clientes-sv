name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Before tests: the popup smoke test needs dist/ and is skipped without it.
      - name: Build
        run: npm run build

      # DOM tests skip themselves: they need portal snapshots that aren't committed.
      - name: Test
        run: npm test
